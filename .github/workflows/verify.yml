name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first one's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      # A runner has neither the reference documents nor Word, so the suites that
      # need either report nothing to run rather than failing. That is right, and
      # it means a green tick here covers less than a green tick on a machine that
      # has them: say which suites actually ran rather than leaving it implied.
      - name: Say which suites ran
        if: always()
        run: pnpm vitest run --reporter=basic 2>&1 | tail -20

  # What `pnpm verify` cannot see: whether the thing a consumer installs works.
  # An exports map that points at a file `files` does not ship, or a `workspace:*`
  # range that never got rewritten, breaks every downstream install and no test in
  # this repository would notice.
  installs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # `pnpm pack` rather than `npm pack`: only pnpm rewrites the `workspace:*`
      # range viewer names core by, and `npm pack` leaves it in the tarball where
      # no consumer can install it.
      - name: Pack the publishable packages
        run: |
          mkdir -p /tmp/packed
          cd packages/core && pnpm pack --pack-destination /tmp/packed && cd -
          cd packages/fonts && pnpm pack --pack-destination /tmp/packed && cd -
          cd packages/viewer && pnpm pack --pack-destination /tmp/packed && cd -
          ! tar -xzOf /tmp/packed/docx-pages-viewer-*.tgz package/package.json | grep -q "workspace:"
          ! tar -xzOf /tmp/packed/docx-pages-fonts-*.tgz package/package.json | grep -q "workspace:"

      # React and its types are the consumer's to bring, which is what a peer
      # dependency means, so the check brings them as a consumer would.
      - name: Install them into a project that is not this one
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm pkg set type=module
          npm install /tmp/packed/*.tgz react react-dom > /dev/null
          npm install --save-dev @types/react @types/react-dom > /dev/null

      - name: Import what they promise, and nothing they do not
        run: |
          cd /tmp/consumer
          cat > check.mjs <<'EOF'
          import { bestEffortMetrics, layOutDocument, openDocx, substitutingMetrics } from "@docx-pages/core";
          import { PACK_FACES } from "@docx-pages/fonts";
          import { defaultFacesFromDisk } from "@docx-pages/fonts/node";
          import { Document, DocxDocument, Page } from "@docx-pages/viewer";
          import { DocxDocument as PackedDocxDocument } from "@docx-pages/viewer/pack";

          const missing = Object.entries({
            bestEffortMetrics, layOutDocument, openDocx, substitutingMetrics, defaultFacesFromDisk,
            Document, DocxDocument, Page, PackedDocxDocument,
          }).filter(([, value]) => value === undefined);

          // The pack is only a pack if the installed tarball carries the files.
          const defaults = await defaultFacesFromDisk();
          const unread = defaults.faces.filter((face) => face.advances.kind !== "advances");
          if (defaults.faces.length !== PACK_FACES.length || unread.length > 0) {
            throw new Error(`the installed font pack read ${defaults.faces.length} of ${PACK_FACES.length} faces, ${unread.length} without widths`);
          }

          if (missing.length > 0) {
            throw new Error(`installed but not exported: ${missing.map(([n]) => n).join(", ")}`);
          }

          // The plumbing is render's, and render is this repository rather than a
          // consumer. A published door into it is a promise nobody meant to make,
          // so the absence of one is worth asserting rather than assuming.
          for (const shut of ["@docx-pages/core/internal", "@docx-pages/core/testing"]) {
            let reached = false;
            try {
              await import(shut);
              reached = true;
            } catch (error) {
              if (error.code !== "ERR_PACKAGE_PATH_NOT_EXPORTED") throw error;
            }
            if (reached) throw new Error(`${shut} is reachable from outside the repository`);
          }

          console.log("all three packages install, export what they promise, and hide what they do not");
          EOF
          node check.mjs

      # The whole point of the split: a project that supplies its own faces
      # installs the viewer without the pack's megabytes. Nothing the root entry
      # reaches may name `@docx-pages/fonts`, and no test inside the workspace
      # can tell, because there the pack is always resolvable.
      - name: Install the viewer without the font pack
        run: |
          mkdir -p /tmp/lean && cd /tmp/lean
          npm init -y > /dev/null
          npm pkg set type=module
          npm install /tmp/packed/docx-pages-core-*.tgz /tmp/packed/docx-pages-viewer-*.tgz react react-dom > /dev/null

          # An optional peer is not installed for you. If that changes, the rest
          # of this step proves nothing, so fail rather than pass quietly.
          test ! -d node_modules/@docx-pages/fonts

          cat > lean.mjs <<'EOF'
          import { Document, DocxDocument, Page, imageResolver } from "@docx-pages/viewer";

          const missing = Object.entries({ Document, DocxDocument, Page, imageResolver })
            .filter(([, value]) => value === undefined);
          if (missing.length > 0) {
            throw new Error(`the root entry lost ${missing.map(([n]) => n).join(", ")} without the pack`);
          }

          // And the pack entry is the one thing that does need it: it must fail
          // for the plain reason rather than resolve to something half-wired.
          let reached = false;
          try {
            await import("@docx-pages/viewer/pack");
            reached = true;
          } catch (error) {
            if (error.code !== "ERR_MODULE_NOT_FOUND") throw error;
          }
          if (reached) {
            throw new Error("@docx-pages/viewer/pack resolved with no @docx-pages/fonts installed");
          }

          console.log("the viewer draws without the pack, and only its pack entry asks for one");
          EOF
          node lean.mjs

      - name: Resolve their types from outside the workspace
        run: |
          cd /tmp/consumer
          npm install --save-dev typescript > /dev/null
          cat > check.ts <<'EOF'
          import { layOutDocument } from "@docx-pages/core";
          import { Document } from "@docx-pages/viewer";

          export const used: unknown = [layOutDocument, Document];
          EOF
          npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --jsx react-jsx --strict check.ts
